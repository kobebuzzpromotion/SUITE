<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUITE — コスプレ背景・演出素材</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171a20; color: #f3f4f7; }
    body { max-width: 1120px; margin: auto; padding: 24px; line-height: 1.6; }
    a { color: #a8d8ff; }
    h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
    .layout { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 24px; }
    fieldset { border: 1px solid #697586; border-radius: 10px; padding: 18px; }
    label { display: block; margin-top: 12px; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 9px; font: inherit; border: 1px solid #8190a2; border-radius: 5px; background: #242c38; color: inherit; }
    input[type=color] { height: 44px; }
    button { margin-top: 18px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #82c4ff; outline-offset: 3px; }
    .preview { background-color: #353a43; background-image: linear-gradient(45deg,#4b515a 25%,transparent 25%),linear-gradient(-45deg,#4b515a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#4b515a 75%),linear-gradient(-45deg,transparent 75%,#4b515a 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; border-radius: 10px; overflow: hidden; }
    canvas { display: block; max-width: 100%; height: auto; margin: auto; }
    .notice { padding: 12px 16px; background: #242c38; border-left: 3px solid #a8d8ff; }
    #status { min-height: 3em; }
    #downloads a { display: inline-block; padding: 10px 14px; margin: 8px 8px 8px 0; border: 1px solid #8190a2; border-radius: 5px; }
    [hidden] { display: none !important; }
    @media(max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><a href="/">SUITEへ戻る</a><h1>コスプレ背景・演出素材</h1></header>
  <p class="notice">端末内の図形描画で作る素材です。AI生成・API通信・クレジット消費はありません。写実的な背景生成や、写真への合成接続は行いません。</p>
  <div class="layout">
    <section aria-label="素材設定">
      <fieldset><legend>素材を作成</legend>
        <label for="preset">プリセット</label><select id="preset"></select>
        <p id="description"></p>
        <label for="seed">バリエーション番号（0〜4294967295）</label><input id="seed" type="number" min="0" max="4294967295" step="1" value="1">
        <label for="color">基調色</label><input id="color" type="color" value="#78a9ed">
        <label for="opacity">不透明度（0〜1）</label><input id="opacity" type="number" min="0" max="1" step="0.05" value="1">
        <label for="width">幅（px）</label><input id="width" type="number" min="64" max="4096" step="1" value="1600">
        <label for="height">高さ（px）</label><input id="height" type="number" min="64" max="4096" step="1" value="1000">
        <p>各辺64〜4096px、合計8,000,000画素まで。大判書き出し用ではなく、素材作成用の上限です。</p>
        <button id="export" type="button" disabled>PNGと素材情報を準備</button>
      </fieldset>
    </section>
    <section aria-label="素材プレビュー">
      <div class="preview"><canvas id="preview" width="1600" height="1000" role="img" aria-label="選択した素材のプレビュー"></canvas></div>
      <p id="contract" class="notice"></p>
      <p id="status" role="status" aria-live="polite">素材を読み込んでいます。</p>
      <div id="downloads" hidden><a id="png-download">PNGを保存</a><a id="manifest-download">素材情報JSONを保存</a></div>
    </section>
  </div>
  <noscript>素材の作成にはJavaScriptが必要です。</noscript>
  <script type="module" src="/src/cosplay-preset-library-ui.mjs"></script>
</body>
</html>
